pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.kikugie.dev/releases' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Per-worktree local build cache to prevent cross-tree cache interactions
buildCache {
    local {
        enabled = true
        directory = new File(rootDir, ".gradle-build-cache")
    }
}


rootProject.name = 'frenchies'

stonecutter {
    centralScript = 'build.gradle'
    create(rootProject) {
        ['26.1', '26.1.1', '26.1.2', '26.3'].each { game ->
            version("${game}-neoforge", game)
            version("${game}-fabric", game).buildscript('fabric.gradle')
        }
        vcsVersion = '26.1-neoforge'
    }
}
