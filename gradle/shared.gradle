version = mod_version
group = mod_group_id
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'LambDynamicLights'
        url = 'https://maven.gegy.dev'
        content {
            includeGroup 'dev.lambdaurora.lambdynamiclights'
            includeGroup 'dev.yumi.commons'
        }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

def loaderSources = sourceSets.create(loader)
stonecutter.constants.put('fabric', loader == 'fabric')
stonecutter.constants.put('neoforge', loader == 'neoforge')
sourceSets.main.java.source(loaderSources.java)
sourceSets.main.resources.source(loaderSources.resources)
sourceSets.main.java.srcDir 'target/java'
if (minecraft_version.startsWith('26.4-')) sourceSets.main.java.srcDir rootProject.file('versions/26.4/java')
sourceSets.main.resources.srcDir 'target/resources'
sourceSets.main.resources.srcDir rootProject.file("versions/${minecraft_version.startsWith('26.4-') ? '26.3' : minecraft_version}/resources")

sourceSets.create('sharedGameTest')
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}
dependencies {
    // Trinkets Updated ships a universal Fabric and NeoForge jar.
    if (!minecraft_version.startsWith('26.4-')) compileOnly "maven.modrinth:XaT8sLP6:${minecraft_version == '26.1' ? 'CFk62USu' : 'lVR1OKgV'}"
    def dynamicLightsVersion = minecraft_version == '26.1' ? '4.10.0+26.1' : '4.13.0+26.3'
    compileOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${dynamicLightsVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

stonecutter {
    replacements {
        string {
            direction = project.minecraft_version != '26.1'
            replace('BlockPos.withinManhattan(', 'BlockPos.withinBoxByManhattanDistance(')
            replace('mc.screen', 'mc.gui.screen()')
            replace('mc.setScreen(', 'mc.gui.setScreen(')
            replace('minecraft.setScreen(', 'minecraft.gui.setScreen(')
            replace('Minecraft.getInstance().setScreen(', 'Minecraft.getInstance().gui.setScreen(')
            replace('mc.getToastManager()', 'mc.gui.toastManager()')
            replace('monster.Slime;', 'monster.cubemob.Slime;')
            replace('mc.gameRenderer.getMainCamera()', 'mc.gameRenderer.mainCamera()')
            replace('Minecraft.getInstance().gameRenderer.getGameRenderState()', 'Minecraft.getInstance().gameRenderer.gameRenderState()')
            replace('!Minecraft.renderNames()', 'Minecraft.getInstance().gui.hud.isHidden()')
            replace('Items.RED_DYE', 'Items.DYE.red()')
            replace('Items.BLUE_DYE', 'Items.DYE.blue()')
            replace('Items.WHITE_DYE', 'Items.DYE.white()')
            replace('Blocks.RED_BED', 'Blocks.BED.red()')
            replace('Blocks.BLUE_BED', 'Blocks.BED.blue()')
        }
        string {
            direction = project.minecraft_version.startsWith('26.4-')
            replace('net.minecraft.client.renderer.RenderPipelines;', 'net.minecraft.client.gui.GuiPipeline;')
            replace('RenderPipelines.GUI_TEXTURED', 'GuiPipeline.TEXTURED')
            replace('extractContents(GuiGraphicsExtractor g, int mouseX, int mouseY, float a)', 'extractContents(GuiGraphicsExtractor g)')
            replace('extractBackground(GuiGraphicsExtractor g, int mouseX, int mouseY, float a)', 'extractBackground(GuiGraphicsExtractor g)')
            replace('drawWarning(GuiGraphicsExtractor gui, DeltaTracker delta)', 'drawWarning(GuiGraphicsExtractor gui)')
            replace('properties.spawnEgg(', 'properties.spawns(')
            replace('adultSounds().whineSound().value()', 'adultSounds().whineSound().orElseThrow().value()')
            replace('adultSounds().ambientSound().value()', 'adultSounds().ambientSound().orElseThrow().value()')
            replace('sounds(recipient, bark.value()', 'sounds(recipient, bark.orElseThrow().value()')
            replace('existsAtPosition(PoiTypes.HOME,', 'existsAtPosition(PoiTypes.HOME.unwrapKey().orElseThrow(),')
        }
        regex {
            direction = project.minecraft_version.startsWith('26.4-')
            replace(/([\w.]+)\.getTextureDiffuseColor\(\)/, 'net.minecraft.util.CommonColors.TEXTURE_TINT_COLORS.pick($1)',
                    /net\.minecraft\.util\.CommonColors\.TEXTURE_TINT_COLORS\.pick\(([\w.]+)\)/, '$1.getTextureDiffuseColor()')
        }
        regex {
            direction = project.minecraft_version != '26.1'
            replace(/(?<![\w.])EntityType\.(?=[A-Z_]+\b)/, 'EntityTypes.',
                    /(?<![\w.])EntityTypes\.(?=[A-Z_]+\b)/, 'EntityType.')
        }
    }
}
